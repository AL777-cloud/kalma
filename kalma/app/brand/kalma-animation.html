<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kálma — Logo Animation</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; }
    body { background: #0a0a12; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }

    .scene { position: relative; width: 500px; height: 500px; display: flex; align-items: center; justify-content: center; }

    .orb-layer {
      position: absolute; top: 50%; left: 50%;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .o1 { width: 400px; height: 400px; background: radial-gradient(circle, rgba(140,180,255,0.25) 0%, rgba(140,180,255,0.08) 50%, transparent 70%); animation: breathe 8s ease-in-out infinite, fadeIn 3s ease 0s both; }
    .o2 { width: 300px; height: 300px; background: radial-gradient(circle, rgba(200,170,255,0.3) 0%, rgba(200,170,255,0.08) 50%, transparent 70%); animation: breathe 8s ease-in-out infinite 2s, fadeIn 3s ease 0.5s both; }
    .o3 { width: 220px; height: 220px; background: radial-gradient(circle, rgba(255,200,220,0.3) 0%, rgba(255,190,210,0.1) 50%, transparent 70%); animation: breathe 8s ease-in-out infinite 4s, fadeIn 3s ease 1s both; }
    .o4 { width: 140px; height: 140px; background: radial-gradient(circle, rgba(180,255,180,0.5) 0%, rgba(180,255,180,0.15) 50%, transparent 70%); animation: breathe 8s ease-in-out infinite 6s, fadeIn 3s ease 1.5s both; }
    .oc { width: 80px; height: 80px; background: radial-gradient(circle, rgba(220,255,220,0.6) 0%, rgba(200,255,200,0.2) 50%, transparent 70%); animation: corePulse 5s ease-in-out infinite, fadeIn 2s ease 2s both; }

    .logo {
      position: absolute;
      bottom: 60px;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 56px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0);
      text-shadow: 0 0 40px rgba(180,255,180,0.15);
      animation: textReveal 3s ease 2.5s forwards;
    }

    .subtitle {
      position: absolute;
      bottom: 30px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.5em;
      color: rgba(255,255,255,0);
      animation: textReveal 2s ease 3.5s forwards;
    }

    /* Floating particles */
    .particle {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    @keyframes breathe { 0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.7; } 50% { transform: translate(-50%,-50%) scale(1.06); opacity: 1; } }
    @keyframes corePulse { 0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 0.5; } 50% { transform: translate(-50%,-50%) scale(1.1); opacity: 0.8; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes textReveal { from { color: rgba(255,255,255,0); } to { color: rgba(255,255,255,0.92); } }
    @keyframes float { 0%, 100% { transform: translateY(0) scale(1); opacity: 0.15; } 50% { transform: translateY(-20px) scale(1.3); opacity: 0.4; } }
  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="orb-layer o1"></div>
    <div class="orb-layer o2"></div>
    <div class="orb-layer o3"></div>
    <div class="orb-layer o4"></div>
    <div class="orb-layer oc"></div>
    <div class="logo">Kálma</div>
    <div class="subtitle">SOUND THAT LISTENS</div>
  </div>

  <script>
    // Generate floating particles
    const scene = document.getElementById('scene');
    const colors = ['rgba(140,180,255,', 'rgba(200,170,255,', 'rgba(255,200,220,', 'rgba(180,255,180,'];
    for (let i = 0; i < 24; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 2 + Math.random() * 4;
      const x = Math.random() * 500;
      const y = Math.random() * 500;
      const color = colors[Math.floor(Math.random() * colors.length)];
      const dur = 4 + Math.random() * 8;
      const delay = Math.random() * 6;
      p.style.cssText = `width:${size}px;height:${size}px;left:${x}px;top:${y}px;background:${color}0.3);animation:float ${dur}s ease-in-out ${delay}s infinite;`;
      scene.appendChild(p);
    }
  </script>
</body>
</html>

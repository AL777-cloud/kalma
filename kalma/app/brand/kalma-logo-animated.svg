<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="a1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#8cb4ff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#8cb4ff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#8cb4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a2" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#c8aaff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#c8aaff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#c8aaff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a3" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#ffc8dc" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ffbed2" stop-opacity="0.1"/>
      <stop offset="70%" stop-color="#ffbed2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="a4" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#b4ffb4" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#b4ffb4" stop-opacity="0.15"/>
      <stop offset="70%" stop-color="#b4ffb4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ac" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#dcffdc" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c8ffc8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#c8ffc8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 0.7; } 50% { transform: scale(1.06); opacity: 1; } }
    @keyframes corePulse { 0%, 100% { transform: scale(1); opacity: 0.5; } 50% { transform: scale(1.1); opacity: 0.8; } }
    @keyframes textFade { 0% { opacity: 0; } 100% { opacity: 0.92; } }
    .layer { transform-origin: 200px 180px; }
    .l1 { animation: breathe 8s ease-in-out infinite; }
    .l2 { animation: breathe 8s ease-in-out infinite 2s; }
    .l3 { animation: breathe 8s ease-in-out infinite 4s; }
    .l4 { animation: breathe 8s ease-in-out infinite 6s; }
    .lc { transform-origin: 200px 180px; animation: corePulse 5s ease-in-out infinite; }
    .logo-text { animation: textFade 2s ease forwards; opacity: 0; }
  </style>
  <rect width="400" height="400" fill="#0a0a12"/>
  <circle class="layer l1" cx="200" cy="180" r="150" fill="url(#a1)"/>
  <circle class="layer l2" cx="200" cy="180" r="112" fill="url(#a2)"/>
  <circle class="layer l3" cx="200" cy="180" r="82" fill="url(#a3)"/>
  <circle class="layer l4" cx="200" cy="180" r="52" fill="url(#a4)"/>
  <circle class="lc" cx="200" cy="180" r="30" fill="url(#ac)"/>
  <text class="logo-text" x="200" y="340" text-anchor="middle" font-family="Georgia, 'Cormorant Garamond', serif" font-size="48" font-weight="300" letter-spacing="12" fill="rgba(255,255,255,0.92)">Kálma</text>
</svg>
